    function App() {
      const [screen, setScreen] = React.useState("dashboard");
      const [carbs, setCarbs] = React.useState("");
      const [bg, setBg] = React.useState("");
      const [iob, setIob] = React.useState("0");
      const [result, setResult] = React.useState(null);
      const [carbRatio, setCarbRatio] = React.useState(10);
      const [corrFactor, setCorrFactor] = React.useState(2.5);
      const [targetBG, setTargetBG] = React.useState(5.5);

      const calcBolus = () => {
        const c = parseFloat(carbs) || 0;
        const b = parseFloat(bg) || 0;
        const i = parseFloat(iob) || 0;
        const mealBolus = c / carbRatio;
        const corr = b > targetBG ? (b - targetBG) / corrFactor : 0;
        const total = Math.max(0, mealBolus + corr - i);
        setResult({ meal: +mealBolus.toFixed(2), corr: +corr.toFixed(2), iob: i, total: +total.toFixed(1) });
      };

      const resetCalc = () => { setCarbs(""); setBg(""); setIob("0"); setResult(null); };

        const n = parseFloat(v);
        if (!n) return null;
        if (n < 4.0) return { label: "LOW", color: "#e53e3e" };
        if (n <= 7.0) return { label: "IN RANGE", color: "#38a169" };
        if (n <= 10.0) return { label: "HIGH", color: "#d97706" };
        return { label: "VERY HIGH", color: "#e53e3e" };
      };

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const dateStr = now.toLocaleDateString("en-GB");
